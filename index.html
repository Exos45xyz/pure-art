<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Pure Smoke</title>
    <meta name="description" content="Particle smoke in a glass cube. A free, open-source three.js toy by Pure Studio." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Black from the first byte, then the stylesheet, which the first paint waits for: the page is never
         shown bare or white. -->
    <style>html, body { background: #000; }</style>
    <link rel="stylesheet" href="/src/style.css" />
    <meta property="og:title" content="Pure Smoke" />
    <meta property="og:description" content="Particle smoke in a glass cube. Free and open source, made with three.js by Pure Studio." />
    <meta property="og:image" content="https://pureart-xyz.vercel.app/og.png" />
    <meta property="og:url" content="https://pureart-xyz.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Loading: in the page itself, so it is there from the first paint. The name, its dragon flying
         (style.css: 24 bands of it, each swaying a beat behind the one above), and a bar that fills as the
         smoke really loads (src/loader.js). -->
    <div class="loader" aria-hidden="true">
      <p class="wordmark logo"><span class="sr">Pure Smoke</span><i class="pure-art name" aria-hidden="true"></i><span class="flight"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i><i style="--i:20"></i><i style="--i:21"></i><i style="--i:22"></i><i style="--i:23"></i></span></p>
      <div class="bar"><i></i></div>
    </div>

    <canvas aria-label="Particle smoke inside a turning glass cube. Drag to turn it, hover to stir the smoke."></canvas>

    <header class="brand">
      <h1 class="wordmark logo"><span class="sr">Pure Smoke</span><i class="pure-art" aria-hidden="true"></i></h1>
    </header>
    <!-- Centred under the cube: what the hand can do, and the studio's credit (on a phone the credit closes
         the sheet instead: ui.js) -->
    <div class="credit">
      <!-- Each hint lights while you do what it says, the first few times (ui.js); a screen without a mouse shows only the drag. -->
      <p class="micro hint"><span data-hint="turn"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M10.5 6a4.5 4.5 0 1 1-4.5-4.5c1.26 0 2.46.5 3.37 1.37L10.5 4M10.5 1.5V4H8"/></svg>Drag to turn</span><span class="by-mouse"> · <span data-hint="stir"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 2.2 10 5.4 6.6 6.6 5.4 10z"/></svg>hover to stir</span> · <span data-hint="zoom"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="3.3" y="1.3" width="5.4" height="9.4" rx="2.7"/><path d="M6 3.4v1.8"/></svg>scroll to zoom</span></span></p>
      <a class="designed micro" href="https://www.purestudio.art/" target="_blank" rel="noopener" aria-label="Designed by Pure Studio">
        <span>Designed by</span><i class="studio-logo" aria-hidden="true"></i>
      </a>
    </div>
    <!-- Where the code lives, at the bottom left (in a narrow window, under the credit) -->
    <footer class="foot">
      <p class="micro source">
        Free &amp; open source · <a class="out" href="https://github.com/Exos45xyz/pure-smoke" target="_blank" rel="noopener"><b>GitHub</b><svg viewBox="0 0 8 8" aria-hidden="true"><path d="M2 6 6 2M2.8 2H6v3.2"/></svg></a>
      </p>
    </footer>

    <aside class="panel" aria-label="Parameters"></aside>
    <button type="button" class="pill reopen">parameters</button>

    <div class="toast" role="status" aria-live="polite"></div>
    <div class="dropzone" aria-hidden="true"><p class="micro"><b>Drop an image</b> to colour the smoke</p></div>

    <div class="fallback">
      <p class="wordmark logo"><span class="sr">Pure Smoke</span><i class="pure-art" aria-hidden="true"></i></p>
      <p class="micro">This needs WebGL 2. Try a recent Chrome, Safari or Firefox with hardware acceleration on.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
